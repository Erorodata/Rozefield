syntax = "proto3";
package protocol;

message AllStoryDatas {
  protocol.StoryChapterDatas StoryChapter = 1;
  protocol.StoryDatas Story = 2;
  protocol.StoryReviewDatas StoryReview = 3;
  protocol.ExtraChapterDatas ExtraChapter = 4;
}
message StoryChapterDatas {
  repeated protocol.StoryChapterConfigure datas = 1;
}
message StoryChapterConfigure {
  int32 ID = 1;
  int32 Name = 2;
  int32 IconID = 3;
  int32 PreChapterUnlock = 4;
  repeated int32 MapCompletionUnlock = 5;
  int32 LvUnlock = 6;
  string TimeUnlock = 7;
