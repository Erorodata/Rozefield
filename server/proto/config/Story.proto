message StoryDatas {
  repeated protocol.StoryConfigure datas = 1;
}
message StoryConfigure {
  int32 ID = 1;
  int32 PreStoryUnlock = 2;
  int32 LvUnlock = 3;
  repeated int32 MapCompletionUnlock = 4;
  string TimeUnlock = 5;
  int32 QuestID = 6;
  int32 Reward = 7;
  int32 ReviewID = 8;
}
message StoryReviewDatas {
  repeated protocol.StoryReviewConfigure datas = 1;
}
message StoryReviewConfigure {
  int32 ID = 1;
  repeated protocol.StoryReviewSet StoryReviewSet = 2;
}
message StoryReviewSet {
  int32 Name = 1;
  int32 DialogID = 2;
}
message ExtraChapterDatas {
  repeated protocol.ExtraChapterConfigure datas = 1;
}
message ExtraChapterConfigure {
  int32 ID = 1;
  repeated protocol.ExtraQuest ExtraQuest = 2;
}
message ExtraQuest {
  int32 TextID = 1;
  int32 Index = 2;
  int32 IconID = 3;
  int32 QuestUnlock = 4;
  int32 LvUnlock = 5;
  int32 QuestID = 6;
  int32 ReviewID = 7;
